name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled plugin
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          contents="$(tar -tzf "$tarball")"
          grep -qx 'package/dist/index.js' <<<"$contents"
          grep -qx 'package/openclaw.plugin.json' <<<"$contents"
